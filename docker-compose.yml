# Local / self-hosted run with Docker.
#
#   docker compose up --build                    -> server + client + local MongoDB
#   docker compose --profile ai up --build       -> also starts the heavy AI microservice
#
# Secrets live in server/.env (copy server/.env.example). This file overrides only what has
# to change for container networking. For free CLOUD hosting see DEPLOYMENT.md instead.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/srlms
      AI_SERVICE_URL: http://ai-service:8001 # harmless if the ai profile is off: classifier.js falls back
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        # the BROWSER calls the API, so this is the host-published port, not the service name
        VITE_BACKEND_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    profiles: ["ai"]
    volumes:
      - ai-models-cache:/root/.cache

volumes:
  ai-models-cache:
  mongo-data:
